<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Opium Location DE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Placeholder Wallpaper - Dark & Clean */
            background: linear-gradient(135deg, #1e1e2f 0%, #0a0a0a 100%);
            height: 100vh;
            color: white;
            user-select: none;
        }

        /* Desktop Area */
        #desktop {
            position: relative;
            height: calc(100vh - 45px);
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 100px);
            grid-auto-rows: 110px;
            gap: 10px;
        }

        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            padding: 10px;
        }

        .icon:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .icon-img {
            width: 48px;
            height: 48px;
            background: #444;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        /* Taskbar */
        #taskbar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 45px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 9999;
        }

        #start-btn {
            height: 100%;
            padding: 0 20px;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            font-weight: bold;
        }

        #start-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #system-tray {
            padding: 0 15px;
            font-size: 0.85rem;
            text-align: right;
        }

        /* Windows */
        .window {
            position: absolute;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 300px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .window-header {
            background: #252525;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }

        .window-controls span {
            margin-left: 10px;
            cursor: pointer;
            opacity: 0.7;
        }

        .window-controls span:hover { opacity: 1; }

        .window-content {
            flex-grow: 1;
            padding: 0;
            background: #000;
        }

        /* Start Menu */
        #start-menu {
            position: fixed;
            bottom: 50px;
            left: 10px;
            width: 200px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #333;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            padding: 10px;
            z-index: 10000;
        }

        .menu-item {
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .menu-item:hover { background: #444; }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="desktop">
        <!-- Icons -->
        <div class="icon" onclick="openTerminal()">
            <div class="icon-img">🐚</div>
            <span>Terminal</span>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <div class="menu-item" onclick="openTerminal()">Terminal</div>
        <hr style="border: 0.5px solid #333; margin: 5px 0;">
        <div class="menu-item" style="color: #f87171" onclick="exitToKernel()">Exit Opium</div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <div id="start-btn" onclick="toggleStart()">OPIUM</div>
        <div id="active-tasks"></div>
        <div id="system-tray">
            <div id="clock-time">12:00 PM</div>
            <div id="clock-date" style="font-size: 0.7rem; opacity: 0.6;">01/01/2026</div>
        </div>
    </div>

    <script>
        // --- WINDOW MANAGEMENT ---
        function openTerminal() {
            createWindow("Terminal", "kernel-term");
            toggleStart(false);
        }

        function createWindow(title, type) {
            const id = 'win-' + Math.random().toString(36).substr(2, 9);
            const win = document.createElement('div');
            win.className = 'window';
            win.id = id;
            win.style.top = '100px';
            win.style.left = '100px';
            win.style.width = '600px';
            win.style.height = '400px';

            win.innerHTML = `
                <div class="window-header" onmousedown="dragElement(this.parentElement)">
                    <span>${title}</span>
                    <div class="window-controls">
                        <span onclick="this.closest('.window').remove()">✕</span>
                    </div>
                </div>
                <div class="window-content">
                    ${type === 'kernel-term' ? '<div style="color: #4ade80; padding: 10px; font-family: monospace;">Opium Kernel Bridge Active...<br>Waiting for input...</div>' : ''}
                </div>
            `;

            document.getElementById('desktop').appendChild(win);
        }

        // --- CLOCK ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('clock-date').innerText = now.toLocaleDateString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- UI LOGIC ---
        function toggleStart(force) {
            const menu = document.getElementById('start-menu');
            if (force === false) menu.style.display = 'none';
            else menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        function exitToKernel() {
            if (window.OS && window.OS.exitGui) {
                window.OS.exitGui();
            } else {
                alert("Kernel link not found.");
            }
        }

        // --- DRAG LOGIC ---
        function dragElement(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                
                const wins = document.querySelectorAll('.window');
                wins.forEach(w => w.style.zIndex = 10);
                elmnt.style.zIndex = 100;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }
    </script>
</body>
</html>
