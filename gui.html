<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Opium Location DE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%); 
            height: 100vh; 
            color: white; 
            user-select: none; 
        }

        #desktop { 
            height: calc(100vh - 45px); 
            padding: 20px; 
            position: relative; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, 100px); 
            grid-auto-rows: 110px; 
            gap: 15px; 
        }

        .icon { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            padding: 10px; 
            border-radius: 12px; 
            transition: background 0.2s; 
        }

        .icon:hover { background: rgba(255,255,255,0.1); }

        .icon-img { 
            width: 50px; 
            height: 50px; 
            background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 28px; 
            margin-bottom: 8px; 
        }

        #taskbar { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            height: 45px; 
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(10px); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 15px; 
            border-top: 1px solid rgba(255,255,255,0.1); 
            z-index: 9999; 
        }

        .window { 
            position: absolute; 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 10px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            width: 600px; 
            height: 400px; 
            overflow: hidden; 
        }

        .window-header { 
            background: #1e293b; 
            padding: 10px 15px; 
            cursor: move; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 0.9rem; 
            font-weight: 600; 
        }

        .window-content { 
            flex: 1; 
            overflow: auto; 
            background: #020617; 
            padding: 15px; 
        }

        #term-input { 
            background: transparent; 
            border: none; 
            outline: none; 
            color: #4ade80; 
            width: 100%; 
            font-family: monospace; 
            font-size: 1rem; 
        }

        .term-line { 
            margin-bottom: 4px; 
            line-height: 1.4; 
            white-space: pre-wrap; 
            font-family: monospace; 
        }
    </style>
</head>
<body>
    <div id="desktop">
        <!-- System Icons -->
        <div class="icon" onclick="openTerminal()">
            <div class="icon-img">🐚</div>
            <span>Terminal</span>
        </div>
    </div>

    <div id="taskbar">
        <div style="font-weight:800; cursor:pointer;" onclick="window.OS.exitGui()">OPIUM</div>
        <div id="clock">12:00:00</div>
    </div>

    <script>
        // --- WINDOW MANAGEMENT ---
        function createWindow(title, content) {
            const win = document.createElement('div');
            win.className = 'window';
            win.style.top = '100px'; 
            win.style.left = '100px';
            win.innerHTML = `
                <div class="window-header" onmousedown="dragElement(this.parentElement)">
                    <span>${title}</span>
                    <span onclick="this.closest('.window').remove()" style="cursor:pointer">✕</span>
                </div>
                <div class="window-content">${content}</div>
            `;
            document.getElementById('desktop').appendChild(win);
            
            // Bring to front on creation
            document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);
            win.style.zIndex = 100;
            return win;
        }

        function openTerminal() {
            if (document.getElementById('term-window')) return;
            const win = createWindow("Opium Terminal", `
                <div id="term-body" style="height:100%; overflow:auto;">
                    <div id="term-logs"></div>
                    <div style="display:flex; align-items:center;">
                        <span style="color:#4ade80; margin-right:8px">opium@location:~$</span>
                        <input id="term-input" spellcheck="false" autofocus>
                    </div>
                </div>
            `);
            win.id = 'term-window';
            const inp = win.querySelector('#term-input');
            inp.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    const cmd = inp.value;
                    inp.value = '';
                    if (window.OS && window.OS.runCommand) {
                        window.OS.runCommand(cmd);
                    }
                }
            });
            win.addEventListener('click', () => inp.focus());
        }

        // --- KERNEL EVENT LISTENERS ---
        
        // Listen for output from the Kernel
        window.addEventListener('opium_print', (e) => {
            const logs = document.getElementById('term-logs');
            if (!logs) return;
            const line = document.createElement('div');
            line.className = 'term-line';
            line.style.color = e.detail.type === 'error' ? '#f87171' : (e.detail.type === 'info' ? '#4ade80' : 'white');
            line.innerText = e.detail.text;
            logs.appendChild(line);
            
            const body = document.getElementById('term-body');
            body.scrollTop = body.scrollHeight;
        });

        // Listen for new program installations to add desktop icons
        window.addEventListener('opium_new_program', (e) => {
            const name = e.detail.name;
            if (document.getElementById('icon-' + name)) return;
            
            const icon = document.createElement('div');
            icon.className = 'icon';
            icon.id = 'icon-' + name;
            icon.onclick = () => window.OS.runCommand(name);
            icon.innerHTML = `<div class="icon-img">🧩</div><span>${name}</span>`;
            document.getElementById('desktop').appendChild(icon);
        });

        // Listen for program execution triggers
        window.addEventListener('opium_run_program', (e) => {
            createWindow(e.detail.name, e.detail.html);
        });

        // --- CLOCK AND UTILS ---
        setInterval(() => { 
            document.getElementById('clock').innerText = new Date().toLocaleTimeString(); 
        }, 1000);

        function dragElement(elmnt) {
            let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
            elmnt.onmousedown = (e) => {
                if (e.target.tagName === 'SPAN') return; // Don't drag if clicking close button
                p3 = e.clientX; p4 = e.clientY;
                document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
                document.onmousemove = (e) => {
                    p1 = p3 - e.clientX; p2 = p4 - e.clientY;
                    p3 = e.clientX; p4 = e.clientY;
                    elmnt.style.top = (elmnt.offsetTop - p2) + "px";
                    elmnt.style.left = (elmnt.offsetLeft - p1) + "px";
                };
                // Focus window
                document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);
                elmnt.style.zIndex = 100;
            };
        }
    </script>
</body>
</html>
